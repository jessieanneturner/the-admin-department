<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#49382D">
  <meta name="description" content="The Admin Department — Keeping one's affairs in order. Or at least attempting to.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>The Admin Department</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #F6F2E9; }
    iframe { display: block; width: 100%; height: 100%; height: 100dvh; border: 0; background: #F6F2E9; }
  </style>
</head>
<body>
  <iframe id="adminApp" src="./app.html" title="The Admin Department"></iframe>
  <script>
    const frame = document.getElementById("adminApp");
    function enhanceAdminApp() {
      try {
        const app = frame.contentWindow;
        const doc = frame.contentDocument;
        if (!app || !doc) return false;

        // Keep the improved department page menu rather than the old number prompt.
        app.toggleMenu = () => {
          app.show("Menu");
          const title = doc.getElementById("pageTitle");
          if (title) title.textContent = "Departments";
          const view = doc.getElementById("view");
          if (view && !view.querySelector(".menu-intro")) {
            const intro = doc.createElement("p");
            intro.className = "muted menu-intro";
            intro.textContent = "Everything in its proper department. In theory.";
            view.prepend(intro);
          }
        };

        if (!doc.getElementById("admin-compact-type")) {
          const typeStyle = doc.createElement("style");
          typeStyle.id = "admin-compact-type";
          typeStyle.textContent = `
            /* Compact typography inside the actual app iframe; leave the brand banner alone. */
            body :is(h1,h2,h3,h4,p,span,label,button,input,textarea,select,small,strong,b,li,th,td) {
              font-size: .90em !important;
            }
            body :is(.muted,.section-title,.sectionhead,.dept,.navlabel,.sidefoot,.empty,.item,.note,.routinehint) {
              font-size: .90em !important;
            }
            #pageTitle { font-size: 1.35rem !important; }
            #admin-brand-header, #admin-brand-header * { font-size: revert !important; }
          `;
          doc.head.appendChild(typeStyle);
        }

        const main = doc.querySelector("main.main") || doc.querySelector("main");
        const top = main && main.querySelector(".top");
        if (!main || !top) return false;
        if (doc.getElementById("admin-brand-header")) return true;

        const style = doc.createElement("style");
        style.textContent = `
          #admin-brand-header {
            display:flex; flex-direction:column; gap:6px;
            padding:18px 22px 16px; margin:0 0 19px;
            background:#203B30; color:#F6F2E9;
            border:1px solid rgba(73,56,45,.22); border-radius:13px;
            box-shadow:0 5px 18px rgba(32,59,48,.10);
          }
          #admin-brand-header .brand-name {
            margin:0; color:#F6F2E9;
            font-family:"Courier New", Courier, monospace;
            font-size:clamp(19px,3vw,25px); font-weight:700;
            letter-spacing:.025em; line-height:1.2;
          }
          #admin-brand-header .brand-line {
            margin:0; color:#E9E3D7;
            font-family:"Courier New", Courier, monospace;
            font-size:11px; letter-spacing:.035em; line-height:1.45;
          }
          /* A slightly more compact type scale throughout the app. The separate brand banner above is intentionally untouched. */
          body :is(h1,h2,h3,h4,p,span,label,button,input,textarea,select,small,strong,b,li,th,td,.navlabel,.sidefoot,.date,.muted,.dept,.routinehint,.sectionhead,.item,.note,.empty,.bottom) {
            font-size: 94% !important;
          }
          @media(max-width:700px) {
            #admin-brand-header { padding:15px 17px 13px; margin-bottom:15px; border-radius:11px; }
          }
        `;
        doc.head.appendChild(style);
        const brand = doc.createElement("section");
        brand.id = "admin-brand-header";
        brand.setAttribute("aria-label", "The Admin Department");
        const name = doc.createElement("h2");
        name.className = "brand-name";
        name.textContent = "The Admin Department";
        const line = doc.createElement("p");
        line.className = "brand-line";
        line.textContent = "Keeping one's affairs in order. Or at least attempting to.";
        brand.append(name, line);
        main.insertBefore(brand, top);
        return true;
      } catch (error) {
        console.warn("Could not enhance The Admin Department.", error);
        return false;
      }
    }
    function retryEnhancement() {
      let attempts = 0;
      const retry = () => {
        if (enhanceAdminApp() || attempts++ > 60) return;
        setTimeout(retry, 150);
      };
      retry();
    }
    // The iframe can finish loading before this script attaches its listener.
    // Try immediately as well as on load, so neither timing is missed.
    frame.addEventListener("load", retryEnhancement);
    retryEnhancement();
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(() => {});
      });
    }
  </script>
</body>
</html>

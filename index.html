<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#49382D">
  <meta name="description" content="The Admin Department — Keeping one's affairs in order. Or at least attempting to.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>The Admin Department</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #F6F2E9; }
    iframe { display: block; width: 100%; height: 100%; height: 100dvh; border: 0; background: #F6F2E9; }
  </style>
</head>
<body>
  <iframe id="adminApp" src="./app.html" title="The Admin Department"></iframe>
  <script>
    const frame = document.getElementById("adminApp");
    frame.addEventListener("load", () => {
      try {
        const doc = frame.contentDocument;
        if (!doc || doc.getElementById("admin-brand-header")) return;
        const style = doc.createElement("style");
        style.textContent = `
          #admin-brand-header {
            display:flex; flex-direction:column; gap:6px;
            padding:18px 22px 16px; margin:0 0 19px;
            background:#203B30; color:#F6F2E9;
            border:1px solid rgba(73,56,45,.22); border-radius:13px;
            box-shadow:0 5px 18px rgba(32,59,48,.10);
          }
          #admin-brand-header .brand-name {
            margin:0; color:#F6F2E9;
            font-family:"Courier New", Courier, monospace;
            font-size:clamp(19px,3vw,25px); font-weight:700;
            letter-spacing:.025em; line-height:1.2;
          }
          #admin-brand-header .brand-line {
            margin:0; color:#E9E3D7;
            font-family:"Courier New", Courier, monospace;
            font-size:11px; letter-spacing:.035em; line-height:1.45;
          }
          @media(max-width:700px) {
            #admin-brand-header { padding:15px 17px 13px; margin-bottom:15px; border-radius:11px; }
          }
        `;
        doc.head.appendChild(style);
        const brand = doc.createElement("section");
        brand.id = "admin-brand-header";
        brand.setAttribute("aria-label", "The Admin Department");
        brand.innerHTML = '<h2 class="brand-name">The Admin Department</h2><p class="brand-line">Keeping one\'s affairs in order. Or at least attempting to.</p>';
        const main = doc.querySelector("main");
        const top = main && main.querySelector(".top");
        if (main && top) main.insertBefore(brand, top);
      } catch (error) {
        console.warn("Could not add the dashboard heading.", error);
      }
    });
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
